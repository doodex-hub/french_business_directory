# Diperbarui dari docker-env warisan project migrasi 17.0->18.0 (2026-08-24) untuk project migrasi
# 18.0->19.0 (2026-08-26):
# - `name:` project di-rename supaya tidak collide dengan container project 17->18 yang mungkin masih
#   ada di Docker Desktop dev.
# - `image: odoo:19.0` — tag ini BELUM diverifikasi tersedia di Docker Hub oleh AI (tidak ada akses
#   jaringan di sesi ini). Kalau `docker compose up` gagal "manifest not found"/"pull access denied",
#   itu indikasi tag resmi belum/berbeda nama, bukan kesalahan compose file — lapor ke dev.
# - `-d` database name di-rename supaya tidak collide dengan DB project 17->18 lama.
# - Ditambahkan `--test-enable --test-tags=/fr_business_directory,/personal_email_usage` — G1 SEKALIGUS
#   menjalankan regression test suite existing (23 test, lihat 05b_TEST_PLAN_MIGRATION.md), bukan cuma
#   install polos seperti compose file 17->18 lama.
# - Tidak pakai `build:`/Dockerfile — modul ini TIDAK punya Tour test (tidak ada OWL/JS, dikonfirmasi
#   01a_MIGRATION_INTAKE.md §2b), jadi `image:` langsung cukup (lebih cepat, tidak perlu Chrome/Dockerfile).
name: french_business_directory_18_19

services:
  db_target:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - target_db_data_19:/var/lib/postgresql/data

  odoo_target:
    image: odoo:19.0
    depends_on:
      - db_target
    ports:
      - "8179:8069"
    environment:
      HOST: db_target
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ..:/mnt/extra-addons
      - ./logs:/var/log/odoo
    command: >
      odoo -d target_db_19 -i fr_business_directory,personal_email_usage
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/fr_business_directory,/personal_email_usage
      --stop-after-init
      --logfile=/var/log/odoo/odoo_target.log

volumes:
  target_db_data_19:
