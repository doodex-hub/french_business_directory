# Diinstansiasi ulang untuk project migrasi 19.0->20.0 (2026-09-24), menggantikan compose 19.0
# (`git show migration/19.0:docker-env/docker-compose.yml` — image odoo:19.0, port 8179).
# - Odoo 20.0 FROM SOURCE (lihat Dockerfile): odoo20 di-bind-mount read-only (tidak ada image
#   resmi odoo:20.0, knowledge 19-to-20.md). Enterprise TIDAK di-mount (modul Community-only).
# - Kedua addon di-mount per folder dari target-codebase (branch migration/20.0).
# - name/db/port unik (8196) supaya tidak bentrok dengan stack 19->20 lain yang jalan paralel di
#   mesin dev (8078/8080/8091/8179 sudah dipakai).
# - --db_host dst eksplisit (tidak ada entrypoint image resmi yang menerjemahkan HOST/USER/PASSWORD).
# - --http-interface=0.0.0.0 wajib di 20.0 kalau server perlu dijangkau dari host.
# - Demo data TIDAK dipasang: di 20.0 itu sudah default ("--without-demo ... (default)",
#   odoo20/odoo/tools/config.py:256-260). `--without-demo=all` sengaja tidak dipakai — di 20.0
#   nilai "all" memicu WARNING "invalid boolean value".
# - Postgres 16: Odoo 20 menolak/memperingatkan Postgres < 16.
# - Gotcha G1: WAJIB `docker compose down -v` sebelum tiap rerun --test-enable (kalau tidak, modul
#   sudah terinstall -> instalasi & test di-skip diam-diam, "0 tests").
name: french_business_directory_19_20

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    shm_size: '2gb'
    depends_on:
      - db
    ports:
      - "8196:8069"
    volumes:
      - D:/Kuncoro/doodex/repo/odoo20:/odoo20:ro
      - ../fr_business_directory:/mnt/extra-addons/fr_business_directory
      - ../personal_email_usage:/mnt/extra-addons/personal_email_usage
      - odoo-data:/var/lib/odoo
      - ./logs:/var/log/odoo
    # Mode G1 + test suite (install -> jalankan test kedua addon -> berhenti).
    # Untuk server interaktif (Step 10): FBD_MODE_ARGS="" dan tanpa --stop-after-init lewat
    # `docker compose run` terpisah — lihat 09_DEV_TESTING.md.
    command: >
      python3 /odoo20/odoo-bin
      -d fbd_test_20
      --db_host=db --db_user=odoo --db_password=odoo
      --data-dir=/var/lib/odoo
      -i fr_business_directory,personal_email_usage
      --addons-path=/odoo20/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/fr_business_directory,/personal_email_usage
      --stop-after-init
      --http-interface=0.0.0.0
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
  odoo-data:
