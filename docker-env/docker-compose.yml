name: french_business_directory_17_18

services:
  db_target:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - target_db_data:/var/lib/postgresql/data

  odoo_target:
    image: odoo:18.0
    depends_on:
      - db_target
    ports:
      - "8178:8069"
    environment:
      HOST: db_target
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ..:/mnt/extra-addons
      - ./logs:/var/log/odoo
      - target_filestore:/var/lib/odoo
    command: >
      odoo -d target_db -i fr_business_directory,personal_email_usage
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --logfile=/var/log/odoo/odoo_target.log
      --stop-after-init

volumes:
  target_db_data:
  target_filestore:
